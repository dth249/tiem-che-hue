<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game đã ngừng hoạt động</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 100vw;
      padding: 24px 20px;
      text-align: center;
    }
    h1 {
      font-size: clamp(22px, 6.5vw, 32px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GAME ĐÃ NGỪNG HOẠT ĐỘNG,<br>CẢM ƠN CÁC BẠN ĐÃ LUÔN<br>ĐỒNG HÀNH CÙNG TÔI TRÊN CON<br>ĐƯỜNG VỪA QUA</h1>
  </div>
</body>
</html>
