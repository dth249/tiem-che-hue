<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game đang bảo trì</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #0a0a0a;
      color: #ffcc00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
    }
    .banner {
      text-align: center;
      margin-bottom: 20px;
      border: 3px solid #ffcc00;
      padding: 18px 16px;
      border-radius: 8px;
      background: #111;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.25);
    }
    .banner h1 {
      font-size: clamp(22px, 7vw, 28px);
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffcc00;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .banner .sub {
      font-size: clamp(16px, 5vw, 18px);
      font-weight: 700;
      color: #ffcc00;
      margin: 6px 0;
    }
    .banner .msg {
      font-size: clamp(13px, 4vw, 15px);
      color: #ffdd55;
      margin-top: 6px;
      line-height: 1.4;
    }
    canvas {
      display: block;
      max-width: 100%;
      border: 2px solid #ffcc00;
      border-radius: 8px;
      background: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>GAME ĐANG BẢO TRÌ</h1>
    <div class="sub">⚠ TẠM THỜI ⚠</div>
    <div class="msg">Vui lòng chờ ngày tái ngộ</div>
  </div>

  <canvas id="gameCanvas" width="320" height="280"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Animation variables
    let shovelAngle = 0;
    let direction = 1;
    let frame = 0;

    function drawBackground() {
      // Ground
      ctx.fillStyle = '#2a1a0a';
      ctx.fillRect(0, 200, 320, 80);

      // Coal pile
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.moveTo(40, 200);
      ctx.quadraticCurveTo(80, 160, 140, 200);
      ctx.quadraticCurveTo(100, 210, 40, 200);
      ctx.fill();

      // More coal lumps
      ctx.fillStyle = '#111';
      for (let i = 0; i < 8; i++) {
        const x = 50 + i * 12;
        const y = 185 + Math.sin(i) * 8;
        ctx.beginPath();
        ctx.arc(x, y, 6 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }

      // Distant mine wall
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, 320, 60);
      ctx.fillStyle = '#333';
      for (let i = 0; i < 10; i++) {
        ctx.fillRect(i * 35, 40, 20, 20);
      }
    }

    function drawCharacter(x, y, shovelRot) {
      // Body
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(x - 12, y - 30, 24, 36); // torso

      // Head
      ctx.beginPath();
      ctx.arc(x, y - 42, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#ffdd66';
      ctx.fill();

      // Helmet
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(x, y - 48, 12, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(x - 12, y - 48, 24, 6);

      // Eyes
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(x - 5, y - 44, 2, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 44, 2, 0, Math.PI * 2);
      ctx.fill();

      // Arms
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';

      // Left arm (holding shovel)
      ctx.beginPath();
      ctx.moveTo(x - 10, y - 20);
      ctx.lineTo(x - 25, y - 5);
      ctx.stroke();

      // Right arm
      ctx.beginPath();
      ctx.moveTo(x + 10, y - 20);
      ctx.lineTo(x + 22, y - 8);
      ctx.stroke();

      // Legs
      ctx.beginPath();
      ctx.moveTo(x - 6, y + 6);
      ctx.lineTo(x - 10, y + 28);
      ctx.moveTo(x + 6, y + 6);
      ctx.lineTo(x + 12, y + 28);
      ctx.stroke();

      // Boots
      ctx.fillStyle = '#333';
      ctx.fillRect(x - 16, y + 26, 12, 6);
      ctx.fillRect(x + 6, y + 26, 12, 6);

      // Shovel
      ctx.save();
      ctx.translate(x - 28, y - 2);
      ctx.rotate(shovelRot);

      // Handle
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -50);
      ctx.stroke();

      // Blade
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.moveTo(-12, -50);
      ctx.lineTo(12, -50);
      ctx.lineTo(8, -38);
      ctx.lineTo(-8, -38);
      ctx.closePath();
      ctx.fill();

      // Coal on shovel when raised
      if (shovelRot < -0.3) {
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(0, -55, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawFlyingCoal(x, y, size) {
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();

      // Animate shovel
      shovelAngle += 0.04 * direction;
      if (shovelAngle > 0.6) direction = -1;
      if (shovelAngle < -0.8) direction = 1;

      // Character
      drawCharacter(200, 170, shovelAngle);

      // Flying coal pieces when shovel is up
      if (shovelAngle < -0.4) {
        const progress = (-shovelAngle - 0.4) / 0.4;
        drawFlyingCoal(160 - progress * 40, 140 - progress * 30, 5);
        drawFlyingCoal(150 - progress * 50, 150 - progress * 20, 4);
      }

      // Extra coal lumps on ground that slightly bounce
      frame++;
      for (let i = 0; i < 4; i++) {
        const bounce = Math.sin(frame * 0.1 + i) * 2;
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(60 + i * 25, 195 + bounce, 5 + (i % 2), 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
