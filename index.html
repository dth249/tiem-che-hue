<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game đã đóng</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #f8fafc;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(59,130,246,.22), transparent 42%),
        linear-gradient(135deg, #0f172a, #111827 55%, #020617);
    }
    .card {
      width: min(100%, 680px);
      padding: 48px 28px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    .icon { font-size: 54px; margin-bottom: 18px; }
    h1 { margin: 0 0 18px; font-size: clamp(30px, 6vw, 48px); }
    p { margin: 0; color: #cbd5e1; font-size: clamp(16px, 3vw, 20px); line-height: 1.8; }
    .thanks { margin-top: 12px; color: #93c5fd; font-weight: 700; }
    .line { width: 72px; height: 4px; border-radius: 9px; background: #60a5fa; margin: 26px auto 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🎮</div>
    <h1>Game đã đóng</h1>
    <p>Cảm ơn bạn đã luôn ủng hộ tôi.</p>
    <p class="thanks">Sự ủng hộ của bạn là điều đáng quý nhất! ❤️</p>
    <div class="line"></div>
  </main>
</body>
</html>
